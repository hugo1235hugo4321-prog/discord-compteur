name: Compteur Discord
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compteur
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mettre à jour les compteurs
        run: node compteur.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          MEMBRES_ID: ${{ secrets.MEMBRES_ID }}
          EN_LIGNE_ID: ${{ secrets.EN_LIGNE_ID }}
      # GitHub coupe les tâches planifiées d'un dépôt public sans activité depuis 60 jours : petit commit vide tous les 45 jours.
      - name: Garder le dépôt actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "compteur-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Garder le compteur actif"
            git push
          fi
